
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>
</head>
<body>
    <h1>Date Difference Calculator</h1>

    <form method="POST">
        <label for="date1">First Date:</label>
        <input type="date" id="date1" name="date1" value="{{ date1 }}" required>

        <br><br>

        <label for="date2">Second Date:</label>
        <input type="date" id="date2" name="date2" value="{{ date2 }}" required>

        <br><br>

        <button type="submit">Calculate Difference</button>
    </form>

    {% if difference is not none %}
        <h2>Result: {{ difference }} days</h2>
    {% endif %}
</body>
</html>
